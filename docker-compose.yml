# Chạy toàn bộ Back-end:  docker compose up -d --build
# Kèm dịch thuật LibreTranslate:  docker compose --profile translate up -d --build
services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max_allowed_packet=128M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-commentary}
      MYSQL_DATABASE: commentary_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      # Chỉ mở cho chính máy này (mật khẩu mặc định yếu); các container khác vẫn truy cập qua mạng compose
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Chỉ chạy khi volume còn trống (lần đầu): tạo schema rồi nạp dữ liệu mẫu từ db.json
      - ./Backend/src/main/resources/db/base-schema.sql:/docker-entrypoint-initdb.d/01-base-schema.sql:ro
      - ./Backend/src/main/resources/db/user-schema.sql:/docker-entrypoint-initdb.d/02-user-schema.sql:ro
      - ./Backend/sql/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  backend:
    build: ./Backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/commentary_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-commentary}
      SQL_INIT_MODE: never
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      USER_LAN_ONLY: ${USER_LAN_ONLY:-true}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      TRANSLATE_ENABLED: ${TRANSLATE_ENABLED:-true}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://libretranslate:5000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: ["translate"]
    environment:
      LT_LOAD_ONLY: vi,en,fr,ja,ko,zh,th
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  mysql_data:
