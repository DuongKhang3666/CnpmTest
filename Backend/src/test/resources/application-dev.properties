# Override chỉ dùng cho TEST: mỗi context Spring có 1 H2 in-memory riêng (unique random),
# tránh dữ liệu dùng chéo giữa các test (@DirtiesContext)
spring.datasource.url=jdbc:h2:mem:commentary_test_${random.uuid};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
