# Profile PROD: Cấu hình cho MySQL hoặc PostgreSQL qua biến môi trường
# Mọi thông tin nhạy cảm lấy từ biến môi trường, không hardcode, không commit

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/commentary_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate ddl-auto cho production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
