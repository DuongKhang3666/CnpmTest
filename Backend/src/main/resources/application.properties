# Application Name
spring.application.name=commentary

# Active Profile (dev: H2 in-memory, prod: MySQL/PostgreSQL qua biến môi trường)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Port
server.port=${SERVER_PORT:8080}

# Cấu hình Upload File (Tối đa 10MB mỗi file, tối đa 100MB mỗi request)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# Cấu hình Thư mục lưu trữ ảnh cục bộ
app.upload.dir=${UPLOAD_DIR:uploads}

# Cấu hình JWT (Lấy từ biến môi trường JWT_SECRET, có giá trị mặc định 256-bit an toàn cho môi trường dev)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cấu hình tài khoản Admin mặc định để seed khi khởi động lần đầu
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:123456}

# Cấu hình Swagger / SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
