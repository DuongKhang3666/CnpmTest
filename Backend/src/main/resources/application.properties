spring.application.name=commentary-backend
server.port=${SERVER_PORT:3000}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/commentary_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1

spring.jackson.default-property-inclusion=always
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.mvc.problemdetails.enabled=false
logging.level.org.springframework.jdbc.core=INFO

# ---------- Khởi tạo schema (CREATE TABLE IF NOT EXISTS, an toàn với DB đã có dữ liệu) ----------
# Đặt SQL_INIT_MODE=never để tắt (docker-compose đã tự dựng schema cho MySQL mới).
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/base-schema.sql,classpath:db/user-schema.sql

# ---------- Back-end user ----------
user.zone=Asia/Ho_Chi_Minh
user.session.online-window-seconds=${USER_ONLINE_WINDOW_SECONDS:45}
user.session.default-access-hours=${USER_ACCESS_HOURS:24}
user.session.max-app-devices=${USER_MAX_APP_DEVICES:5}
# Chỉ cho thiết bị trong mạng nội bộ (LAN) vào hệ thống; đặt false khi triển khai lên Internet
user.lan-only=${USER_LAN_ONLY:true}
# Địa chỉ (IP/tên miền) đưa vào link QR của admin; để trống = tự lấy IP LAN của máy chủ
user.public-host=${PUBLIC_HOST:}

# Dịch thuật: LibreTranslate tự triển khai (đặt TRANSLATE_ENABLED=false để tắt)
user.translate.enabled=${TRANSLATE_ENABLED:true}
user.translate.url=${LIBRETRANSLATE_URL:http://127.0.0.1:5000}
user.translate.api-key=${LIBRETRANSLATE_API_KEY:}
user.translate.timeout-seconds=${TRANSLATE_TIMEOUT_SECONDS:30}

# ---------- Bảo mật quản trị ----------
# Mọi API ngoài /api/user/** (CRUD cũ /sites, /narrations..., /api/admin/**) đều cần đăng nhập admin.
# Để trống ADMIN_PASSWORD = sinh mật khẩu ngẫu nhiên và in ra log mỗi lần khởi động (chỉ để chạy thử).
admin.email=${ADMIN_EMAIL:admin@gmail.com}
admin.password=${ADMIN_PASSWORD:}
# Khoá ký token đăng nhập (>= 16 ký tự). Để trống = ngẫu nhiên mỗi lần chạy (đăng nhập lại sau khi restart).
admin.token-secret=${ADMIN_TOKEN_SECRET:}
admin.token-hours=${ADMIN_TOKEN_HOURS:12}
# Chặn dò mật khẩu: sai quá số lần trong cửa sổ thời gian (giây) thì khoá theo IP
admin.login.max-failures=${ADMIN_LOGIN_MAX_FAILURES:5}
admin.login.window-seconds=${ADMIN_LOGIN_WINDOW_SECONDS:300}
# Khoá máy-với-máy (header X-Admin-Key) cho script/CI; để trống = tắt
admin.api-key=${ADMIN_API_KEY:}
# CORS: mặc định chỉ nhận trang web từ localhost/mạng nội bộ. Thêm origin khác, cách nhau dấu phẩy
# (ví dụ https://admin.example.com). Đặt * để cho phép mọi origin (không khuyến nghị).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
